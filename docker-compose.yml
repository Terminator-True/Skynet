services:
  mysql:
    image: mysql:8.4
    container_name: skynet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: skynet
      MYSQL_USER: skynet
      MYSQL_PASSWORD: skynet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - skynet-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skynet-mysql-data:
